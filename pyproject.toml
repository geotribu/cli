[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geotribu"
dynamic = ["version"]
description = "Une ligne de commande pour Geotribu qui offre des outils pour rechercher et consulter les contenus et images, et faciliter les tâches récurrentes des contributeur/ices."
readme = "README.md"
license = "MIT"
authors = [{ name = "Julien Moura (Geotribu)", email = "geotribu@gmail.com" }]
keywords = [
    "cli",
    "Geotribu",
    "GIS",
    "images",
    "lunr",
    "Mastodon",
    "markdown",
    "Pillow",
    "search",
    "tinify",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.11"
dependencies = [
    "argcomplete>=3.7.2,<4",
    "imagesize>=2.0.1,<2.1",
    "lunr[languages]>=0.8.0,<0.9",
    "markdownify>=1.2.3,<1.3",
    "Mastodon.py[grapheme]>=2.3.3,<2.4",
    "orjson>=3.13.0,<3.14",
    "packaging>=26.3,<27",
    "rich_argparse>=1.8.0,<1.9",
    "python-frontmatter>=1.3.0,<2",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dev = ["pre-commit>=4", "ruff>=0.17.3"]
doc = [
    "furo==2025.*",
    "matplotlib>=3.8.2,<4",
    "myst-parser[linkify]>=2",
    "sphinx-argparse-cli>=1",
    "sphinx-autobuild>=2024",
    "sphinx-autodoc-typehints<4",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinxext-opengraph>=0.13.0",
    "sphinx-sitemap>=2.4.0",
]
test = [
    "Pillow>=13.0.0,<14",
    "pytest-cov>=4",
    "pytest-retry>=1.6",
    "validators>=0.36.0,<0.37",
]
packaging = [
    "build>=1.2.2,<2",
    "distro==1.9.* ; sys_platform == 'linux'",
    "pyinstaller>=6.14.2,<6.22",
    "pyinstaller-hooks-contrib>=2025,<2027",
    "pypiwin32==223 ; sys_platform == 'win32'",
]
all = ["tinify>=1.7.2,<2", "Pillow>=13.0.0,<14"]
img-local = ["Pillow>=13.0.0,<14"]
img-remote = ["tinify>=1.7.2,<2"]

[project.urls]
Homepage = "https://cli.geotribu.fr/"
Documentation = "https://cli.geotribu.fr/"
Repository = "https://github.com/geotribu/cli/"
"Bug Reports" = "https://github.com/geotribu/cli/issues/"

[project.scripts]
geotribu = "geotribu_cli.cli:main"
geotribu-cli = "geotribu_cli.cli:main"

# -- TOOLING --
[tool.bdist_wheel]
universal = false


[tool.coverage.run]
branch = true
omit = [".venv/*", "docs/*", "*tests*"]

[tool.coverage.report]
exclude_lines = [
    "if self.debug:",
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
ignore_errors = true
show_missing = true


[tool.pytest.ini_options]
addopts = [
    "--junitxml=junit/test-results.xml",
    "--cov-config=pyproject.toml",
    "--cov=geotribu_cli",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=xml",
    "--ignore=tests/_wip/",
]
junit_family = "xunit2"
norecursedirs = [
    ".* build dev development dist docs CVS fixtures _darcs {arch} *.egg venv _wip",
]
python_files = ["test_*.py"]
testpaths = ["tests"]
retries = 2
retry_delay = 0.5
cumulative_timing = false


[tool.ruff]
extend-exclude = ["old", "tests/dev", "tests/fixtures"]
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
exclude = ["docs/conf.py"]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "ERA", # eradicate (commented code)
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501", # line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Ignore docstring rules in tests
"tests/**" = ["D"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 130

[tool.ruff.lint.pydocstyle]
convention = "google"

# setuptools
[tool.setuptools]
py-modules = ["geotribu_cli"]

[tool.setuptools.packages.find]
exclude = [
    "contrib",
    "docs",
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    ".venv",
]

[tool.setuptools.package-data]
"*" = ["*"]

[tool.setuptools_scm]
write_to = "geotribu_cli/_version.py"
fallback_version = "0.36.0-dev"
